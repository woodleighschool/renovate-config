# https://mise.jdx.dev/configuration.html
[tools]
"aqua:jdx/jactionlint" = "2.3.0"
lefthook = "2.2.2"
node = "26.12.1"
oxfmt = "0.74.0"
"npm:renovate" = { version = "44.182.0", trust_policy_excludes = [
  "@yarnpkg/libzip",
] }
shellcheck = "0.11.0"

[tasks."lint"]
description = "Check JSON/JSON5, YAML, Markdown, and shell formatting"
run = [
  "oxfmt --check .",
  "git ls-files -co --exclude-standard '*.sh' | xargs -r shellcheck",
]

[tasks.validate]
description = "Validate Renovate presets against the schema"
run = "renovate-config-validator --strict --no-global"

[hooks]
postinstall = "lefthook install"
